<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d080"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <!-- Gold border -->
  <rect x="10" y="10" width="492" height="492" rx="88" fill="none" stroke="#c9a84c" stroke-width="12"/>
  <!-- PRP text -->
  <text x="256" y="230" font-size="108" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="'Arial Black',Arial,sans-serif" letter-spacing="-2">PRP</text>
  <!-- Divider -->
  <rect x="90" y="252" width="332" height="4" rx="2" fill="#c9a84c" opacity="0.5"/>
  <!-- 5G text in gold -->
  <text x="256" y="388" font-size="150" font-weight="900" text-anchor="middle" fill="url(#textGrad)" font-family="'Arial Black',Arial,sans-serif">5G</text>
</svg>
