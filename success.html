<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! — PRP 5G Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #141414;
            border: 1.5px solid #d4af37;
            border-radius: 18px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
        }
        .emoji { font-size: 70px; margin-bottom: 20px; }
        h1 { color: #FFD700; font-size: 28px; margin-bottom: 12px; }
        p { color: #aaa; font-size: 15px; line-height: 1.6; margin-bottom: 10px; }
        .redirect-msg {
            margin-top: 30px;
            font-size: 13px;
            color: #555;
        }
        .bar-wrap {
            width: 100%;
            background: #222;
            border-radius: 10px;
            height: 6px;
            margin-top: 15px;
            overflow: hidden;
        }
        .bar {
            height: 6px;
            background: #FFD700;
            border-radius: 10px;
            width: 0%;
            animation: load 3s linear forwards;
        }
        @keyframes load {
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🎉</div>
        <h1>¡Pago Exitoso!</h1>
        <p>Bienvenido a <strong style="color:#FFD700;">PRP 5G Academy</strong></p>
        <p>Tu acceso de por vida ha sido activado.</p>
        <p>Serás redirigido al curso en unos segundos...</p>
        <div class="redirect-msg">
            Redirigiendo...
            <div class="bar-wrap"><div class="bar"></div></div>
        </div>
    </div>

    <script>
        // Activar acceso del usuario que viene de Stripe
        (function() {
            const pendingEmail = localStorage.getItem('prp5g_pending_email');
            const pendingName = localStorage.getItem('prp5g_pending_name') || 'Médico PRP';

            let session;

            if (pendingEmail) {
                // Buscar usuario registrado y marcarlo como pagado
                const users = JSON.parse(localStorage.getItem('prp5g_users') || '[]');
                const user = users.find(u => u.email === pendingEmail);

                if (user) {
                    user.paid = true;
                    user.paidAt = new Date().toISOString();
                    user.plan = 'lifetime';
                    localStorage.setItem('prp5g_users', JSON.stringify(users));
                    session = user;
                } else {
                    // Pagó sin registrarse previamente
                    session = {
                        name: pendingName,
                        email: pendingEmail,
                        plan: 'lifetime',
                        paid: true,
                        paidAt: new Date().toISOString()
                    };
                }

                localStorage.removeItem('prp5g_pending_email');
                localStorage.removeItem('prp5g_pending_name');
            } else {
                // Acceso directo sin flujo de pago (fallback)
                const existing = localStorage.getItem('prp5g_session');
                if (!existing) {
                    session = {
                        name: 'Médico PRP',
                        email: 'medico@prp5g.com',
                        plan: 'lifetime',
                        paid: true,
                        paidAt: new Date().toISOString()
                    };
                }
            }

            if (session) {
                localStorage.setItem('prp5g_session', JSON.stringify(session));
            }
        })();

        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 3000);
    </script>
</body>
</html>
